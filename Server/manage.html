<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จัดการเครื่องพิมพ์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif !important; background-color: #f9fafb; color: #1f2937; }
    .card { background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body class="bg-gray-100 p-6 md:p-12">
  <div class="max-w-3xl mx-auto space-y-6">

    <!-- Title -->
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-2xl font-bold">🖨️ จัดการเครื่องพิมพ์</h2>
    </div>

    <!-- Card: Printer Search -->
    <div class="card p-6 space-y-4">
      <label class="block text-lg font-semibold">Printer ID</label>
      <div class="flex flex-col sm:flex-row gap-3">
        <input id="printerId" type="text" class="border px-4 py-3 rounded-lg w-full focus:ring-2 focus:ring-blue-500 outline-none" placeholder="เช่น rpi-cd1ee4">
        <button onclick="loadPrinter()" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition w-full sm:w-auto">
          โหลดข้อมูล
        </button>
      </div>
      <p id="loadResult" class="text-sm"></p>
    </div>

    <!-- Card: Printer Form -->
    <form id="printerForm" class="card p-6 space-y-5 hidden" onsubmit="savePrinter(event)">
      <div>
        <label class="block text-lg font-semibold">ชื่อสถานที่</label>
        <input id="location_name" class="border px-4 py-3 w-full rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label class="block text-lg font-semibold">Latitude</label>
          <input id="lat" class="border px-4 py-3 w-full rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-lg font-semibold">Longitude</label>
          <input id="lon" class="border px-4 py-3 w-full rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-lg font-semibold">URL (API / Node)</label>
        <input id="url" class="border px-4 py-3 w-full rounded-lg bg-gray-200 text-gray-500" disabled>
      </div>

      <!-- ✅ NEW: CUPS URL + ปุ่มตั้งค่าเครื่องพิมพ์ -->
      <div>
        <label class="block text-lg font-semibold">CUPS URL</label>
        <div class="flex flex-col sm:flex-row gap-3">
          <input id="cups_url"
                 class="border px-4 py-3 w-full rounded-lg bg-gray-200 text-gray-500"
                 placeholder="รอเครื่องออนไลน์เพื่อรับ CUPS URL"
                 disabled>
          <button type="button"
                  onclick="openCups()"
                  class="bg-amber-600 text-white px-4 py-3 rounded-lg text-sm sm:text-base font-semibold hover:bg-amber-700 transition w-full sm:w-auto">
            ตั้งค่าเครื่องพิมพ์
          </button>
        </div>
        <p class="text-xs text-gray-500 mt-1">
          ลิงก์ไปหน้า CUPS ของเครื่องพิมพ์ (ใช้เพิ่ม/แก้ printer, driver ฯลฯ)
        </p>
      </div>

      <!-- Select default/selected printer from list_printers -->
      <div id="selectedPrinterWrap" class="hidden">
        <label class="block text-lg font-semibold">เลือกเครื่องพิมพ์ (ในเครื่อง)</label>
        <select id="selected_printer" class="border px-4 py-3 w-full rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></select>
        <p id="printers_help" class="text-sm text-gray-500 mt-1"></p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label class="block text-lg font-semibold">ราคา ขาวดำ</label>
          <input id="bw_price" type="number" step="0.01" min="0"
                 class="border px-4 py-3 w-full rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-lg font-semibold">ราคา สี</label>
          <input id="color_price" type="number" step="0.01" min="0"
                 class="border px-4 py-3 w-full rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-lg font-semibold">ขาวดำเท่านั้น</label>
        <select id="bw_only" class="border px-4 py-3 w-full rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="true">true</option>
          <option value="false">false</option>
        </select>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label class="block text-lg font-semibold">เวลาเปิด</label>
          <input id="open_time" type="time" class="border px-4 py-3 w-full rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-lg font-semibold">เวลาปิด</label>
          <input id="close_time" type="time" class="border px-4 py-3 w-full rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3">
        <button type="submit" class="bg-green-600 text-white px-6 py-3 rounded-lg text-lg font-semibold hover:bg-green-700 transition w-full sm:w-auto">
          บันทึก
        </button>
        <button type="button" id="btnTestPrint" onclick="testPrint()" class="bg-indigo-600 text-white px-6 py-3 rounded-lg text-lg font-semibold hover:bg-indigo-700 transition w-full sm:w-auto">
          พิมพ์ทดสอบ
        </button>

        <!-- Queue & Status buttons -->
        <button type="button" onclick="checkQueue()" class="bg-gray-700 text-white px-6 py-3 rounded-lg text-lg font-semibold hover:bg-gray-800 transition w-full sm:w-auto">
          ตรวจสอบคิวงาน
        </button>
        <button type="button" onclick="cancelAllQueues()" class="bg-red-600 text-white px-6 py-3 rounded-lg text-lg font-semibold hover:bg-red-700 transition w-full sm:w-auto">
          ยกเลิกคิวทั้งหมด
        </button>
        <button type="button" onclick="checkPrinterStatus()" class="bg-slate-600 text-white px-6 py-3 rounded-lg text-lg font-semibold hover:bg-slate-700 transition w-full sm:w-auto">
          ตรวจสอบสถานะเครื่อง
        </button>
      </div>

      <p id="saveResult" class="text-sm"></p>
      <p id="testPrintResult" class="text-sm text-gray-600"></p>

      <!-- Queue result card -->
      <div id="queueResult" class="mt-4 hidden">
        <div class="card p-4">
          <h3 class="text-lg font-semibold mb-2">สถานะคิวงาน</h3>
          <div id="queueContent" class="text-sm text-gray-700 space-y-2"></div>
        </div>
      </div>

      <!-- Printer status result card -->
      <div id="statusResult" class="mt-4 hidden">
        <div class="card p-4">
          <h3 class="text-lg font-semibold mb-2">สถานะเครื่องพิมพ์ (CUPS)</h3>
          <div id="statusContent" class="text-sm text-gray-700 space-y-2"></div>
        </div>
      </div>
    </form>
  </div>

  <!-- Loading/Result Overlay -->
  <div id="loadingOverlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl shadow-xl px-6 py-6 flex flex-col items-center gap-3 w-[min(92vw,420px)] text-center">
      <div id="overlayIcon"></div>
      <div id="overlayTitle" class="text-lg font-semibold"></div>
      <div id="overlaySubtitle" class="text-sm text-gray-500"></div>
      <div id="overlayActions" class="mt-2 hidden flex gap-2">
        <button type="button" onclick="showLoadingOverlay(false)" class="px-4 py-2 rounded-lg bg-gray-800 text-white">ปิด</button>
        <a href="/historys.html" class="px-4 py-2 rounded-lg bg-indigo-600 text-white">ดูประวัติ</a>
      </div>
    </div>
  </div>

  <script>
    let API_BASE = "";
    let LIFF_ID  = "";
    let lineUid  = null;

    async function loadConfig() {
      const res = await fetch("/static/config.json", { cache: "no-store" });
      const cfg = await res.json();
      API_BASE = cfg.API_BASE;
      LIFF_ID  = cfg.LIFF_ID;
      console.log("✅ Config loaded:", cfg);
    }

    async function initLiff() {
      await loadConfig();
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) return liff.login();
      const profile = await liff.getProfile();
      lineUid = profile.userId;
      console.log("👤 Current UID:", lineUid);
    }

    function setInlineMsg(elId, ok, msg){
      const el = document.getElementById(elId);
      if (!el) return;
      el.textContent = msg;
      el.className = 'text-sm ' + (ok ? 'text-green-600' : 'text-red-600');
    }

    function fillSimpleFields(data) {
      const keys = [
        "location_name",
        "lat",
        "lon",
        "url",
        "cups_url",      // ✅ new
        "bw_price",
        "color_price",
        "bw_only",
        "open_time",
        "close_time"
      ];
      for (const key of keys) {
        const el = document.getElementById(key);
        if (!el) continue;
        if (key === "bw_only") {
          el.value = String(!!data[key]);
        } else if (key === "bw_price" || key === "color_price") {
          el.value = (data[key] ?? "");
        } else {
          if (data[key] !== undefined && data[key] !== null) el.value = data[key];
          else el.value = "";
        }
      }
      if (!data.open_time) document.getElementById("open_time").value = "00:00";
      if (!data.close_time) document.getElementById("close_time").value = "23:59";
    }

    function fillPrinterSelect(data) {
      const wrap = document.getElementById('selectedPrinterWrap');
      const sel  = document.getElementById('selected_printer');
      const help = document.getElementById('printers_help');
      sel.innerHTML = '';

      const list = Array.isArray(data.list_printers) ? data.list_printers : [];
      if (list.length === 0) {
        wrap.classList.add('hidden');
        return;
      }

      for (const name of list) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      }

      if (data.selected_printer && list.includes(data.selected_printer)) {
        sel.value = data.selected_printer;
      } else {
        sel.value = list[0];
      }

      help.textContent = `พบเครื่องพิมพ์ทั้งหมด ${list.length} รายการ`;
      wrap.classList.remove('hidden');
    }

    function apiUrl(path){
      return (API_BASE && /^https?:\/\//.test(API_BASE)) ? `${API_BASE}${path}` : path;
    }

    async function loadPrinter() {
      const id = document.getElementById("printerId").value.trim();
      if (!id){
        setInlineMsg('loadResult', false, "กรอก printer_id ก่อน");
        return;
      }
      setInlineMsg('loadResult', true, "กำลังโหลด...");

      try{
        const res = await fetch(apiUrl(`/get_printer/${encodeURIComponent(id)}`), {
          headers: { "X-Line-Uid": lineUid }
        });
        const text = await res.text();
        let data; try { data = JSON.parse(text); } catch { data = null; }
        if (!res.ok){
          console.error("❌ Error get_printer:", text);
          setInlineMsg('loadResult', false, (data?.detail || data?.message || "ไม่มีสิทธิ์หรือไม่พบเครื่องพิมพ์"));
          return;
        }

        setInlineMsg('loadResult', true, "โหลดสำเร็จ");
        document.getElementById("printerForm").classList.remove("hidden");
        fillSimpleFields(data);
        fillPrinterSelect(data);
      } catch(err){
        console.error("get_printer error:", err);
        setInlineMsg('loadResult', false, String(err));
      }
    }

    async function savePrinter(event) {
      event.preventDefault();
      const id = document.getElementById("printerId").value.trim();

      const getVal = (id) => (document.getElementById(id)?.value ?? '').trim();
      const payload = {};

      const loc = getVal('location_name'); if (loc !== '') payload.location_name = loc;
      const lat  = getVal('lat');           if (lat !== '') payload.lat = lat;
      const lon  = getVal('lon');           if (lon !== '') payload.lon = lon;

      const open = getVal('open_time');     payload.open_time = open !== '' ? open : '00:00';
      const close= getVal('close_time');    payload.close_time = close !== '' ? close : '23:59';

      const urlVal = getVal('url');         if (urlVal !== '') payload.url = urlVal;

      const numOrSkip = (v) => {
        if (v === '') return undefined;
        const n = parseFloat(v);
        return Number.isFinite(n) ? n : undefined;
      };
      const bwp = numOrSkip(getVal('bw_price'));    if (bwp !== undefined) payload.bw_price = bwp;
      const col = numOrSkip(getVal('color_price')); if (col !== undefined) payload.color_price = col;

      const bwo = getVal('bw_only'); if (bwo !== '') payload.bw_only = (bwo === 'true');

      const selectedEl = document.getElementById('selected_printer');
      if (selectedEl && !selectedEl.closest('#selectedPrinterWrap').classList.contains('hidden')) {
        payload.selected_printer = selectedEl.value;
      }

      setInlineMsg('saveResult', true, "กำลังบันทึก...");

      try{
        const res = await fetch(apiUrl(`/update_printer/${encodeURIComponent(id)}`), {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Line-Uid": lineUid
          },
          body: JSON.stringify(payload)
        });
        const text = await res.text();
        let data; try { data = JSON.parse(text); } catch { data = {}; }

        if (res.ok){
          console.log("📌 update_printer response:", data);
          setInlineMsg('saveResult', true, data.message || 'บันทึกสำเร็จ');
          await loadPrinter();
        } else {
          console.error('update_printer failed:', text);
          setInlineMsg('saveResult', false, data?.detail || data?.message || text);
        }
      } catch(err){
        console.error('update_printer error:', err);
        setInlineMsg('saveResult', false, String(err));
      }
    }

    function setTestBtnLoading(isLoading){
      const btn = document.getElementById('btnTestPrint');
      if (!btn) return;
      btn.disabled = isLoading;
      btn.textContent = isLoading ? 'กำลังพิมพ์ทดสอบ...' : 'พิมพ์ทดสอบ';
    }

    function showLoadingOverlay(flag){
      const el = document.getElementById('loadingOverlay');
      if (!el) return;
      if (flag){
        el.classList.remove('hidden');
        document.body.classList.add('overflow-hidden');
      } else {
        el.classList.add('hidden');
        document.body.classList.remove('overflow-hidden');
      }
    }

    function setOverlayState(state, title, subtitle){
      const icon = document.getElementById('overlayIcon');
      const t = document.getElementById('overlayTitle');
      const s = document.getElementById('overlaySubtitle');
      const actions = document.getElementById('overlayActions');
      if (!icon || !t || !s || !actions) return;

      const spinner = `
        <svg class="animate-spin h-8 w-8 text-indigo-600" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" stroke="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>`;
      const check = `
        <svg class="h-8 w-8 text-green-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>`;
      const xmark = `
        <svg class="h-8 w-8 text-red-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>`;

      if (state === 'loading'){
        icon.innerHTML = spinner;
        t.textContent = title || 'กำลังทำรายการ...';
        s.textContent = subtitle || '';
        actions.classList.add('hidden');
      } else if (state === 'success'){
        icon.innerHTML = check;
        t.textContent = title || 'สำเร็จ';
        s.textContent = subtitle || '';
        actions.classList.remove('hidden');
      } else if (state === 'error'){
        icon.innerHTML = xmark;
        t.textContent = title || 'ไม่สำเร็จ';
        s.textContent = subtitle || '';
        actions.classList.remove('hidden');
      }
    }

    async function testPrint(){
      const id = document.getElementById('printerId').value.trim();
      const resultEl = document.getElementById('testPrintResult');

      if (!id){
        showLoadingOverlay(true);
        setOverlayState('error', 'กรอก Printer ID ก่อน', '');
        return;
      }
      if (!lineUid){
        showLoadingOverlay(true);
        setOverlayState('error', 'ยังไม่ได้ล็อกอิน LINE', 'กรุณาเข้าสู่ระบบ LINE ก่อนทำรายการ');
        return;
      }

      setTestBtnLoading(true);
      if (resultEl) resultEl.textContent = '';
      showLoadingOverlay(true);
      setOverlayState('loading', 'กำลังพิมพ์ทดสอบ...', 'กำลังส่งไฟล์ไปยังเครื่องพิมพ์');

      try{
        const callUrl = apiUrl(`/test_printer/${encodeURIComponent(id)}`);
        const res = await fetch(callUrl, { method: 'POST', headers: { 'X-Line-Uid': lineUid } });
        const text = await res.text();
        let data; try { data = JSON.parse(text); } catch { data = {}; }

        if (res.ok && (data.status === 'ok' || data.status === 'OK')){
          if (resultEl) {
            resultEl.textContent = `✅ ส่งงานทดสอบแล้ว (ref_id: ${data.ref_id || '-'} | target: ${data.target_url || '-'})`;
          }
          setOverlayState('success', 'ส่งพิมพ์ทดสอบสำเร็จ', `ref_id: ${data.ref_id || '-'}`);
        } else {
          const msg = data?.message || text || 'Unknown error';
          if (resultEl) resultEl.textContent = `⚠️ ไม่สำเร็จ: ${msg}`;
          setOverlayState('error', 'พิมพ์ทดสอบไม่สำเร็จ', msg);
        }
      } catch(err){
        if (resultEl) resultEl.textContent = '❌ เกิดข้อผิดพลาดระหว่างพิมพ์ทดสอบ';
        setOverlayState('error', 'เกิดข้อผิดพลาดระหว่างพิมพ์', String(err));
      } finally {
        setTestBtnLoading(false);
      }
    }

    // ===== NEW: Node base URL =====
    function getNodeBaseUrl(){
      const u = (document.getElementById('url')?.value || '').trim();
      if (u && /^https?:\/\//.test(u)) return u.replace(/\/+$/,'');
      return "";
    }

    // ✅ NEW: เปิด CUPS URL ในแท็บใหม่
    function openCups(){
      const cups = (document.getElementById('cups_url')?.value || '').trim();
      if (!cups){
        showLoadingOverlay(true);
        setOverlayState(
          'error',
          'ยังไม่มี CUPS URL',
          'กรุณาเช็คว่าเครื่องออนไลน์และระบบสร้าง tunnel แล้ว หรือกดโหลดข้อมูลเครื่องใหม่อีกครั้ง'
        );
        return;
      }

      try {
        const target = /^https?:\/\//.test(cups) ? cups : `https://${cups}`;
        window.open(target, '_blank');
      } catch(e){
        showLoadingOverlay(true);
        setOverlayState('error', 'เปิดหน้า CUPS ไม่สำเร็จ', String(e));
      }
    }

    // ===== NEW: Queue render =====
    function renderQueueList(list){
      const wrap = document.getElementById('queueResult');
      const content = document.getElementById('queueContent');
      if (!wrap || !content) return;
      wrap.classList.remove('hidden');

      if (!list || list.length === 0){
        content.innerHTML = `<p class="text-gray-500">ไม่มีงานค้างในคิว</p>`;
        return;
      }

      const html = list.map(j => {
        const age = (j.age_minutes !== null && j.age_minutes !== undefined) ? `${j.age_minutes} นาที` : '-';
        return `
          <div class="p-2 border rounded-lg">
            <div class="font-semibold">${j.job || '-'}</div>
            <div class="text-xs text-gray-600">ผู้ใช้: ${j.user || '-'} | ขนาด: ${j.size_bytes || '-'} | อายุงาน: ${age}</div>
            <div class="text-xs text-gray-500">ส่งเมื่อ: ${j.submitted_at || '-'}</div>
          </div>
        `;
      }).join('');
      content.innerHTML = html;
    }

    async function checkQueue(){
      const base = getNodeBaseUrl();
      if (!base){
        showLoadingOverlay(true);
        setOverlayState('error', 'ไม่พบ URL ของเครื่องพิมพ์', 'กรุณาโหลดข้อมูลเครื่องก่อน');
        return;
      }
      const selected = document.getElementById('selected_printer')?.value;
      const url = selected ? `${base}/printer/queue?printer=${encodeURIComponent(selected)}` : `${base}/printer/queue`;

      showLoadingOverlay(true);
      setOverlayState('loading', 'กำลังตรวจสอบคิวงาน...', '');

      try{
        const res = await fetch(url, { method: 'GET' });
        const data = await res.json();
        renderQueueList(data.jobs || []);
        setOverlayState('success', 'ดึงคิวงานสำเร็จ', `พบ ${data.jobs?.length || 0} งาน`);
      } catch(e){
        setOverlayState('error', 'ดึงคิวงานไม่สำเร็จ', String(e));
      }
    }

    async function cancelAllQueues(){
      const base = getNodeBaseUrl();
      if (!base){
        showLoadingOverlay(true);
        setOverlayState('error', 'ไม่พบ URL ของเครื่องพิมพ์', 'กรุณาโหลดข้อมูลเครื่องก่อน');
        return;
      }
      showLoadingOverlay(true);
      setOverlayState('loading', 'กำลังยกเลิกคิวทั้งหมด...', '');

      try{
        const res = await fetch(`${base}/printer/cancel_all`, { method: 'POST' });
        const data = await res.json();
        // refresh queue
        try{
          const selected = document.getElementById('selected_printer')?.value;
          const url = selected ? `${base}/printer/queue?printer=${encodeURIComponent(selected)}` : `${base}/printer/queue`;
          const res2 = await fetch(url);
          const data2 = await res2.json();
          renderQueueList(data2.jobs || []);
        }catch(e){}

        setOverlayState('success', 'ยกเลิกคิวทั้งหมดสำเร็จ', `ยกเลิกแล้ว ${data.canceled ?? 0} งาน`);
      } catch(e){
        setOverlayState('error', 'ยกเลิกคิวไม่สำเร็จ', String(e));
      }
    }

    // ===== NEW: Printer status =====
    function renderStatus(data){
      const wrap = document.getElementById('statusResult');
      const content = document.getElementById('statusContent');
      if (!wrap || !content) return;
      wrap.classList.remove('hidden');

      if (!data || !Array.isArray(data.printers)){
        content.innerHTML = `<p class="text-red-600">อ่านสถานะไม่สำเร็จ</p>`;
        return;
      }

      const defaultName = data.default ? `<span class="px-2 py-0.5 text-xs bg-blue-100 text-blue-700 rounded-full ml-2">default: ${data.default}</span>` : '';
      const printersHtml = data.printers.map(p => {
        const enabled = /enabled/.test(p.state) && !/disabled/.test(p.state);
        const badge = enabled
          ? `<span class="px-2 py-0.5 text-xs bg-green-100 text-green-700 rounded-full">enabled</span>`
          : `<span class="px-2 py-0.5 text-xs bg-red-100 text-red-700 rounded-full">disabled</span>`;
        return `
          <div class="p-2 border rounded-lg">
            <div class="flex items-center gap-2">
              <div class="font-semibold">${p.name || '-'}</div>
              ${badge}
            </div>
            <div class="text-xs text-gray-600 mt-1">${p.state || '-'}</div>
          </div>
        `;
      }).join('');

      content.innerHTML = `
        <div class="mb-2 text-sm text-gray-600">สถานะจาก CUPS ${defaultName}</div>
        <div class="space-y-2">${printersHtml}</div>
      `;
    }

    async function checkPrinterStatus(){
      const base = getNodeBaseUrl();
      if (!base){
        showLoadingOverlay(true);
        setOverlayState('error', 'ไม่พบ URL ของเครื่องพิมพ์', 'กรุณาโหลดข้อมูลเครื่องก่อน');
        return;
      }
      showLoadingOverlay(true);
      setOverlayState('loading', 'กำลังตรวจสอบสถานะเครื่อง...', '');

      try{
        const res = await fetch(`${base}/printer/status`, { method: 'GET' });
        const data = await res.json();
        renderStatus(data);
        setOverlayState('success', 'ดึงสถานะเครื่องสำเร็จ', '');
      } catch(e){
        setOverlayState('error', 'ดึงสถานะเครื่องไม่สำเร็จ', String(e));
      }
    }

    window.onload = initLiff;
  </script>
</body>
</html>
